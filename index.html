<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LKMOTORS ERP - V18.2 (수정/삭제 완벽지원)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: flex; }
        .tab-content.active.block-mode { display: block; }
        
        /* 명세서 스타일 */
        .bill-paper { background: white; color: black; padding: 30px; width: 210mm; min-height: 297mm; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .t-logic { width: 100%; border-collapse: collapse; border: 2px solid #000; table-layout: fixed; }
        .t-logic td, .t-logic th { border: 1px solid #000; padding: 5px; font-size: 11px; color: black; height: 32px; vertical-align: middle; }
        .bg-label { background: #f1f5f9; font-weight: 900; text-align: center; }
        .bg-header { background: #e2e8f0; font-weight: 900; text-align: center; font-size: 12px; }
        .input-clean { width: 100%; border: none; outline: none; font-weight: 700; background: transparent; color: black; }
        
        @media screen and (max-width: 1024px) { 
            .bill-zoom { transform: scale(0.42); transform-origin: top left; width: 210mm; } 
            .scroll-box { overflow-x: auto; height: 750px; background: #1e293b; border-radius: 20px; padding: 10px; } 
        }
        @media print { .no-print { display: none !important; } .bill-paper { box-shadow: none; margin: 0; width: 100%; } body { background: white; } }
    </style>
</head>
<body class="pt-16">

    <div id="auth-layer" class="fixed inset-0 bg-slate-950 z-[9999] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-[40px] border border-white/10 w-full max-w-md shadow-2xl">
            <h1 class="text-3xl font-black italic text-blue-500 mb-8 text-center">LK MOTORS ERP</h1>
            <div id="login-box" class="space-y-4">
                <input type="text" id="uid" placeholder="아이디" class="w-full p-4 bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500">
                <input type="password" id="upw" placeholder="비밀번호" class="w-full p-4 bg-slate-800 rounded-2xl outline-none border border-transparent focus:border-blue-500">
                <div class="flex items-center gap-2 px-2 text-sm text-gray-400">
                    <input type="checkbox" id="save-id" class="w-4 h-4 accent-blue-500">
                    <label for="save-id" class="cursor-pointer">로그인 정보 저장</label>
                </div>
                <button onclick="handleLogin()" class="w-full py-4 bg-blue-600 rounded-2xl font-black text-xl">접속하기</button>
            </div>
        </div>
    </div>

    <nav class="no-print fixed top-0 left-0 right-0 h-14 bg-slate-900 border-b border-blue-500/30 z-50 flex items-center px-4 justify-between font-bold text-xs">
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
            <span class="text-blue-500 font-black italic text-lg shrink-0 mr-4">LK ERP</span>
            <button onclick="showTab('rep')" id="btn-rep" class="tab-btn px-4 py-1.5 bg-blue-600 rounded-full shrink-0">정비/이력</button>
            <button onclick="showTab('book')" id="btn-book" class="tab-btn px-4 py-1.5 bg-slate-800 rounded-full shrink-0">예약관리</button>
            <button onclick="showTab('parts')" id="btn-parts" class="tab-btn px-4 py-1.5 bg-slate-800 rounded-full shrink-0">부품관리</button>
            <button onclick="showTab('admin')" id="btn-admin" class="tab-btn px-4 py-1.5 bg-slate-800 rounded-full text-orange-400 shrink-0">승인관리</button>
        </div>
        <button onclick="location.reload()" class="text-red-500 font-black">LOGOUT</button>
    </nav>

    <main id="tab-rep" class="tab-content active p-2 lg:p-6 flex flex-col lg:flex-row gap-6">
        <aside class="w-full lg:w-80 no-print space-y-4 shrink-0">
            <div class="bg-slate-900 p-5 rounded-[30px] border border-blue-500/30 shadow-xl">
                <h3 class="text-blue-400 font-black mb-3 italic">🔎 이력 조회</h3>
                <input id="search-car" placeholder="차량번호" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 uppercase mb-2 outline-none">
                <div class="grid grid-cols-2 gap-1 mb-2">
                    <div class="flex flex-col"><span class="text-[9px] text-gray-500 px-1">시작일</span><input type="date" id="h-start" class="p-2 bg-slate-800 rounded-lg text-[10px] outline-none"></div>
                    <div class="flex flex-col"><span class="text-[9px] text-gray-500 px-1">종료일</span><input type="date" id="h-end" class="p-2 bg-slate-800 rounded-lg text-[10px] outline-none"></div>
                </div>
                <button onclick="loadPeriodHistory()" class="w-full py-2 bg-blue-600 rounded-xl font-bold text-xs">조회하기</button>
                <div id="history-list" class="mt-3 space-y-1 max-h-48 overflow-y-auto pr-1"></div>
            </div>

            <div class="bg-slate-900 p-5 rounded-[30px] border border-white/10 shadow-xl">
                <h3 id="form-title" class="text-emerald-400 font-black mb-3 italic text-sm">📝 정비 기록 관리</h3>
                <div class="space-y-2 text-[11px]">
                    <input id="db-car" placeholder="차량번호" class="w-full p-2 bg-slate-800 rounded-lg border border-emerald-500 uppercase font-bold outline-none">
                    <div class="grid grid-cols-2 gap-1">
                        <input id="db-name" placeholder="차주성함" class="p-2 bg-slate-800 rounded-lg border border-white/5">
                        <input id="db-phone" placeholder="연락처" class="p-2 bg-slate-800 rounded-lg border border-white/5">
                    </div>
                    <div class="grid grid-cols-2 gap-1">
                        <input id="db-type" placeholder="차량형식" class="p-2 bg-slate-800 rounded-lg text-[10px] border border-white/5">
                        <input id="db-regdate" placeholder="차량등록일" class="p-2 bg-slate-800 rounded-lg text-[10px] border border-white/5">
                    </div>
                    <input id="db-chassis" placeholder="차대번호" class="w-full p-2 bg-slate-800 rounded-lg border border-white/5">
                    <div class="grid grid-cols-1 gap-1 border-t border-white/10 pt-2">
                        <div class="flex justify-between items-center"><span>입고일</span><input type="date" id="db-in" class="bg-slate-800 rounded p-1 outline-none text-[10px]"></div>
                        <div class="flex justify-between items-center text-blue-400"><span>완료일</span><input type="date" id="db-comp" class="bg-slate-800 rounded p-1 outline-none text-[10px]"></div>
                        <div class="flex justify-between items-center text-emerald-400"><span>출고일</span><input type="date" id="db-out" class="bg-slate-800 rounded p-1 outline-none text-[10px]"></div>
                    </div>
                    <button id="main-btn" onclick="saveAndSync()" class="w-full py-3 bg-emerald-600 rounded-xl font-black mt-2 transition-colors">기록 저장</button>
                    <button id="cancel-btn" onclick="resetForm()" class="hidden w-full py-2 bg-slate-700 rounded-xl font-bold mt-1">취소</button>
                </div>
            </div>
        </aside>

        <div class="flex-1 scroll-box">
            <div class="bill-zoom">
                <div class="bill-paper" id="print-area">
                    <h1 class="text-center text-4xl font-black italic mb-10 underline">정 비 명 세 서</h1>
                    <table class="t-logic">
                        <tr>
                            <td class="bg-label w-24">차량번호</td><td><input id="v-car" class="input-clean text-lg font-black uppercase"></td>
                            <td class="bg-label w-24">차량형식</td><td><input id="v-type" class="input-clean"></td>
                        </tr>
                        <tr>
                            <td class="bg-label">차대번호</td><td><input id="v-chassis" class="input-clean"></td>
                            <td class="bg-label">차량등록일</td><td><input id="v-regdate" class="input-clean"></td>
                        </tr>
                    </table>
                    <table class="t-logic mt-6">
                        <thead>
                            <tr class="bg-header">
                                <th style="width: 30%;">품명(정비내역)</th>
                                <th style="width: 15%;">규격</th>
                                <th style="width: 10%;">수량</th>
                                <th style="width: 15%;">단가</th>
                                <th style="width: 15%;">기술료</th>
                                <th style="width: 15%;">금액</th>
                            </tr>
                        </thead>
                        <tbody id="bill-body"></tbody>
                    </table>
                    <div class="mt-12 flex justify-end">
                        <div class="w-72 border-4 border-black p-4 text-right">
                            <div class="text-[11px] font-bold">공급가액: <span id="v-sub">0</span></div>
                            <div class="text-[11px] font-bold border-b-2 border-black pb-2">부가세: <span id="v-vat">0</span></div>
                            <div class="text-3xl font-black text-blue-700 pt-2 font-mono">₩ <span id="v-total">0</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 mt-4 no-print">
                <button onclick="window.print()" class="flex-1 bg-slate-800 py-4 rounded-xl font-black">🖨️ 인쇄하기</button>
                <button onclick="initRows()" class="px-6 bg-slate-700 rounded-xl text-xs">내용 비우기</button>
            </div>
        </div>
    </main>

    <main id="tab-book" class="tab-content block-mode p-4 max-w-4xl mx-auto"><div class="bg-slate-900 p-8 rounded-[40px] border border-white/10 shadow-2xl"><h2 class="text-2xl font-black text-blue-400 italic mb-8">📅 예약 관리</h2><div id="booking-list"></div></div></main>
    <main id="tab-parts" class="tab-content block-mode p-4 max-w-4xl mx-auto"><div class="bg-slate-900 p-8 rounded-[40px] border border-white/10 shadow-2xl"><h2 class="text-2xl font-black text-emerald-400 italic mb-8">📦 부품 재고</h2><div id="parts-list"></div></div></main>
    <main id="tab-admin" class="tab-content block-mode p-4 max-w-2xl mx-auto"><div class="bg-slate-900 p-8 rounded-[40px] border border-orange-500/30 shadow-2xl"><h2 class="text-2xl font-black text-orange-400 italic mb-8">👑 승인 관리</h2><div id="wait-list"></div></div></main>

    <script>
        // 파이어베이스 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDhTPGNKNm38PSBdATs9lks0lYu52QrP3A",
            authDomain: "lkmotors-246f1.firebaseapp.com",
            databaseURL: "https://lkmotors-246f1-default-rtdb.firebaseio.com",
            projectId: "lkmotors-246f1",
            storageBucket: "lkmotors-246f1.firebasestorage.app",
            messagingSenderId: "389443224",
            appId: "1:389443224:web:c9b78c1afd3abc1c262aed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let targetEditKey = null; // 수정 중인 데이터 키 저장 변수

        window.onload = function() {
            const savedId = localStorage.getItem('saved_lk_id');
            const savedPw = localStorage.getItem('saved_lk_pw');
            if(savedId && savedPw) {
                document.getElementById('uid').value = savedId;
                document.getElementById('upw').value = savedPw;
                document.getElementById('save-id').checked = true;
            }
            initRows();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('h-end').value = today;
            const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
            document.getElementById('h-start').value = lastMonth.toISOString().split('T')[0];
        };

        function handleLogin() {
            const id = document.getElementById('uid').value, pw = document.getElementById('upw').value;
            const isSave = document.getElementById('save-id').checked;
            if(id === "sansay333" && pw === "aa272728") { loginProc(id, pw, 'admin', isSave); return; }
            db.ref('users/'+id).once('value', s => {
                const u = s.val();
                if(u && u.pw === pw && u.status === 'approved') loginProc(id, pw, 'staff', isSave);
                else alert("아이디/비번 확인 또는 승인 대기중");
            });
        }
        function loginProc(id, pw, role, isSave) {
            if(isSave) { localStorage.setItem('saved_lk_id', id); localStorage.setItem('saved_lk_pw', pw); }
            else { localStorage.removeItem('saved_lk_id'); localStorage.removeItem('saved_lk_pw'); }
            document.getElementById('auth-layer').style.display='none';
            if(role !== 'admin') document.getElementById('btn-admin').style.display='none';
            loadAllData();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.replace('bg-blue-600', 'bg-slate-800'));
            document.getElementById('btn-'+id).classList.replace('bg-slate-800', 'bg-blue-600');
        }

        // [이력 조회 및 수정/삭제 버튼 생성]
        function loadPeriodHistory() {
            const car = document.getElementById('search-car').value.toUpperCase();
            const start = document.getElementById('h-start').value;
            const end = document.getElementById('h-end').value;
            if(!car) return alert("차량번호 입력 필수");

            db.ref('history/'+car).orderByChild('dateComp').startAt(start).endAt(end).on('value', s => {
                const list = document.getElementById('history-list'); list.innerHTML = "";
                if(!s.exists()) { list.innerHTML = "<p class='text-xs text-center text-gray-500 py-4'>조회 결과 없음</p>"; return; }
                s.forEach(c => {
                    const d = c.val();
                    list.innerHTML += `
                    <div class="p-2 bg-slate-800 rounded-xl mb-1 text-[11px] flex justify-between items-center border border-white/5">
                        <div class="cursor-pointer flex-1" onclick="fillForm('${car}', '${c.key}')">
                            <span class="text-blue-400 font-bold block">${d.dateComp}</span>
                            <span class="font-bold">₩${d.total}</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="setEditMode('${car}', '${c.key}')" class="bg-amber-600 px-2 py-1 rounded text-[10px] font-bold">수정</button>
                            <button onclick="deleteRecord('${car}', '${c.key}')" class="bg-red-600 px-2 py-1 rounded text-[10px] font-bold">삭제</button>
                        </div>
                    </div>`;
                });
            });
        }

        // [삭제 기능 - 명령어 remove() 사용]
        function deleteRecord(car, key) {
            if(confirm("이 정비 기록을 완전히 삭제하시겠습니까?")) {
                db.ref(`history/${car}/${key}`).remove()
                .then(() => alert("삭제 완료"));
            }
        }

        // [수정 모드 전환]
        function setEditMode(car, key) {
            targetEditKey = key;
            db.ref(`history/${car}/${key}`).once('value', s => {
                const d = s.val();
                document.getElementById('db-car').value = car;
                document.getElementById('db-name').value = d.name || "";
                document.getElementById('db-phone').value = d.phone || "";
                document.getElementById('db-type').value = d.type || "";
                document.getElementById('db-regdate').value = d.regDate || "";
                document.getElementById('db-chassis').value = d.chassis || "";
                document.getElementById('db-in').value = d.dateIn || "";
                document.getElementById('db-comp').value = d.dateComp || "";
                document.getElementById('db-out').value = d.dateOut || "";
                
                fillForm(car, key); // 명세서 표까지 데이터 채우기

                // 버튼 디자인 변경
                document.getElementById('form-title').innerText = "🛠 기록 수정 모드";
                document.getElementById('main-btn').innerText = "변경 사항 업데이트";
                document.getElementById('main-btn').classList.replace('bg-emerald-600', 'bg-amber-600');
                document.getElementById('cancel-btn').classList.remove('hidden');
            });
        }

        function resetForm() {
            targetEditKey = null;
            location.reload();
        }

        function fillForm(car, key) {
            db.ref('history/'+car+'/'+key).once('value', s => {
                const d = s.val();
                document.getElementById('v-car').value = car;
                document.getElementById('v-type').value = d.type || "";
                document.getElementById('v-chassis').value = d.chassis || "";
                document.getElementById('v-regdate').value = d.regDate || "";
            });
        }

        function initRows() {
            const b = document.getElementById('bill-body'); b.innerHTML = "";
            for(let i=0; i<18; i++) {
                b.innerHTML += `<tr class="i-row">
                    <td><input class="input-clean"></td>
                    <td><input class="input-clean"></td>
                    <td><input type="number" class="input-clean text-center i-q" value="0" oninput="calc()"></td>
                    <td><input type="number" class="input-clean text-right i-p" value="0" oninput="calc()"></td>
                    <td><input type="number" class="input-clean text-right i-l" value="0" oninput="calc()"></td>
                    <td class="text-right font-black i-s">0</td>
                </tr>`;
            }
            calc();
        }

        function calc() {
            let sub = 0;
            document.querySelectorAll('.i-row').forEach(r => {
                const q = r.querySelector('.i-q').value||0, p = r.querySelector('.i-p').value||0, l = r.querySelector('.i-l').value||0;
                const total = (q * p) + parseInt(l); r.querySelector('.i-s').innerText = total.toLocaleString(); sub += total;
            });
            document.getElementById('v-sub').innerText = sub.toLocaleString();
            document.getElementById('v-vat').innerText = Math.floor(sub*0.1).toLocaleString();
            document.getElementById('v-total').innerText = Math.floor(sub*1.1).toLocaleString();
        }

        // [저장 및 수정 로직 통합]
        function saveAndSync() {
            const car = document.getElementById('db-car').value.toUpperCase();
            const dateComp = document.getElementById('db-comp').value;
            if(!car || !dateComp) return alert("필수 항목 확인");

            const data = { 
                name: document.getElementById('db-name').value, 
                phone: document.getElementById('db-phone').value,
                type: document.getElementById('db-type').value, 
                regDate: document.getElementById('db-regdate').value,
                chassis: document.getElementById('db-chassis').value, 
                dateComp: dateComp,
                dateIn: document.getElementById('db-in').value,
                dateOut: document.getElementById('db-out').value,
                total: document.getElementById('v-total').innerText 
            };

            if(targetEditKey) {
                // 수정 처리 - update 명령어 사용
                db.ref(`history/${car}/${targetEditKey}`).update(data)
                .then(() => { alert("수정 성공"); resetForm(); });
            } else {
                // 신규 처리 - push 명령어 사용
                db.ref('history/'+car).push(data);
                alert("정상 등록되었습니다.");
            }
        }

        function loadAllData() {
            db.ref('users').orderByChild('status').equalTo('pending').on('value', s => {
                const list = document.getElementById('wait-list'); list.innerHTML = "";
                s.forEach(c => {
                    list.innerHTML += `<div class="flex justify-between items-center p-4 bg-slate-800 rounded-2xl border border-white/5">
                        <span class="font-bold text-sm">${c.val().name}</span>
                        <button onclick="db.ref('users/${c.key}').update({status:'approved'})" class="bg-blue-600 px-4 py-1.5 rounded-lg text-[10px] font-black">승인</button>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
